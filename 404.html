<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found | Soren Weil</title>
  
  <link rel="icon" href="assets/images/H53zwtvCVdtLq91Rj8fb9VaNv5A.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="assets/images/0Jx5IAKnaB5WDUmqxmJCAy7bDg.png" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-wrapper {
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 0;
    }
    .not-found-code {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -0.05em;
    }
    .not-found-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .not-found-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 32px;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: var(--text-primary);
      color: var(--bg-color);
      border-radius: var(--radius-pill);
      font-weight: 600;
      transition: all var(--transition-fast);
    }
    .home-btn:hover {
      background: var(--accent);
      color: var(--accent-text);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    
    <!-- Site Header -->
    <header class="site-header">
      <div class="brand-wrapper">
        <a href="index.html" class="brand-avatar" aria-label="Soren Weil Home">
          <img src="assets/images/WsnVxaSk0dKenAYdMT2G7bpCDAQ.png" alt="Soren Weil">
        </a>
        <a href="index.html" class="brand-name">Soren Weil</a>
      </div>

      <div class="nav-status">
        <span>AI Design Engineer</span>
      </div>

      <div class="nav-actions">
        <div class="live-time-wrapper">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="live-clock">Cairo • 12:50 PM</span>
        </div>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="not-found-wrapper">
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">Lost in space?</h1>
      <p class="not-found-desc">The page you are looking for doesn't exist or has been moved to another coordinate.</p>
      <a href="index.html" class="home-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Back to Home</span>
      </a>
    </main>

    <!-- Site Footer -->
    <footer class="site-footer">
      <div class="social-links">
        <a href="mailto:hello@soren.com" class="social-link">Email</a>
        <a href="tel:+201151234567" class="social-link">Phone</a>
        <a href="https://x.com/soren.weil" target="_blank" rel="noopener noreferrer" class="social-link">X (Twitter)</a>
        <a href="https://instagram.com/its-soren" target="_blank" rel="noopener noreferrer" class="social-link">Instagram</a>
        <a href="https://linkedin.com/in/weil.soren" target="_blank" rel="noopener noreferrer" class="social-link">LinkedIn</a>
      </div>
      <div class="footer-copy">
        <p>&copy; 2026 Soren Weil. All rights reserved.</p>
      </div>
    </footer>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
